# Stage 5. Merge to main → staging deploys on its own. Production waits for
# the release manager to approve the `production` environment (gate 5).
# Needs repo secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID; skips with a
# notice until they exist.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: make build
      - name: Deploy to staging alias
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::Netlify secrets not set; skipping staging deploy"
            echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          publish=$(sed -n 's/^publish_dir: *//p' .sdlc.yaml); publish=${publish:-dist}
          out=$(npx --yes netlify-cli@latest deploy --dir="$publish" --alias=staging --json --message "staging ${GITHUB_SHA::7}")
          echo "$out"
          echo "url=$(echo "$out" | jq -r .deploy_url)" >> "$GITHUB_OUTPUT"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Gate 5: this environment requires a reviewer (the release manager).
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: make build
      - name: Deploy to production
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::Netlify secrets not set; skipping production deploy"
            echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          publish=$(sed -n 's/^publish_dir: *//p' .sdlc.yaml); publish=${publish:-dist}
          out=$(npx --yes netlify-cli@latest deploy --dir="$publish" --prod --json --message "release ${GITHUB_SHA::7} approved by ${GITHUB_ACTOR}")
          echo "$out"
          echo "url=$(echo "$out" | jq -r .url)" >> "$GITHUB_OUTPUT"
