name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: make check
        run: make check
      - name: Plans on main must be approved
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          bad=0
          for f in plan/[0-9]*.md; do
            [ -f "$f" ] || continue
            if grep -q '^status: proposed' "$f"; then echo "::error file=$f::plan is still proposed; the engineer approves it before merge (gate 3)"; bad=1; fi
          done
          exit $bad
